<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B5CAD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="건강길잡이">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>건강정보 직접찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F9;--card:#FFFFFF;--line:#D5DCE6;--ink:#1A2433;--sub:#3D4A5C;
--blue:#0B5CAD;--blueBg:#E3EEFB;--green:#17714F;--greenBg:#E2F3EC;--red:#C62828;--redInk:#9E1C1C;
--brown:#A04E00;--brownBg:#FDEEDC;--purple:#5B2E91;--purpleBg:#EFE7F8;--warnBg:#FFF4E5;--warn:#8A4100}
*{box-sizing:border-box;min-width:0}
html{font-size:18px}html.big{font-size:22px}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 'Noto Sans KR',system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:480px;margin:0 auto;padding:1.1rem 1.1rem 2rem;display:flex;flex-direction:column;gap:.9rem}
h1{margin:0;font-size:1.6rem;font-weight:900;line-height:1.2}
h2{margin:0;font-size:1.15rem;font-weight:700}
p{margin:0}
.sub{color:var(--sub)}
.small{font-size:.83rem;color:var(--sub);line-height:1.55}
.top{display:flex;align-items:center;gap:.6rem}
.back{width:3rem;height:3rem;flex:none;border-radius:.8rem;border:2px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}
button,a.btn{font:inherit;cursor:pointer;text-decoration:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--line);border-radius:1.1rem;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.6rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.tile{min-height:8.2rem;border-radius:1.1rem;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:1rem;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;font-size:1.25rem;font-weight:700;line-height:1.25}
.ico{width:3rem;height:3rem;border-radius:.9rem;display:grid;place-items:center}
.sos{display:flex;align-items:center;gap:.9rem;background:var(--red);color:#fff;border:0;border-radius:1.1rem;padding:1rem 1.1rem;min-height:5rem;text-align:left;width:100%}
.sos b{display:block;font-size:1.45rem;font-weight:900}.sos span span{font-size:.95rem;color:#FFE3E3}
.btn,.chip{min-height:3rem;border-radius:.8rem;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:.4rem;padding:.3rem .6rem;text-align:center}
.solid{border:0;color:#fff}
.go{display:flex;align-items:center;justify-content:space-between;gap:.6rem;border-radius:1rem;padding:.9rem 1rem;min-height:4rem;color:#fff;text-decoration:none;border:0;width:100%;text-align:left}
.go b{display:block;font-size:1.1rem;font-weight:900}.go small{font-size:.85rem;opacity:.9}
input,textarea{font:inherit;font-size:max(16px,1.1rem);color:var(--ink);background:var(--card);border:2px solid var(--blue);border-radius:.8rem;padding:.7rem .9rem;width:100%}
textarea{min-height:6rem;resize:vertical;border-color:var(--line)}
label{font-weight:700}
.badge{font-size:.8rem;font-weight:700;border-radius:999px;padding:.15rem .6rem;white-space:nowrap}
.demo{font-size:.8rem;font-weight:700;color:var(--warn);background:var(--warnBg);border-radius:.6rem;padding:.35rem .6rem;align-self:flex-start}
.num{font-weight:900;white-space:nowrap}
#map{height:220px;border-radius:1rem;border:2px solid var(--line);overflow:hidden;background:#e8ecf1}
.place h2{font-size:1.15rem;font-weight:900}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:.8rem;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;z-index:20}
.toast.show{opacity:1}
.dim{position:fixed;inset:0;background:rgba(10,16,24,.6);display:flex;align-items:center;justify-content:center;padding:1.2rem;z-index:10}
.dlg{background:var(--card);border-radius:1.3rem;padding:1.5rem 1.2rem;width:100%;max-width:420px;display:flex;flex-direction:column;gap:.9rem;text-align:center}
.dlg h2{font-size:1.5rem;font-weight:900;line-height:1.3}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast" role="status"></div>
<div class="dim" id="callDlg" hidden>
<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="callTitle">
<h2 id="callTitle"></h2>
<p class="sub" id="callSub"></p>
<a class="btn solid" id="callYes" href="tel:119" style="min-height:4rem;font-size:1.3rem;font-weight:900;background:var(--red)">네, 전화할게요</a>
<button class="btn" id="callNo" style="min-height:4rem;font-size:1.2rem;border-color:var(--ink)">아니요, 돌아갈게요</button>
</div>
</div>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=900a29a0fc67d1c23e8233506e2e22ee&libraries=services&autoload=false"></script>
<script>
{
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const svg = (d, c, s = 28) => `<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {
  back: '<path d="M15 18l-6-6 6-6"/>',
  pill: '<path d="M10.5 20.5 3.5 13.5a5 5 0 0 1 7-7l7 7a5 5 0 0 1-7 7z"/><path d="M8.5 8.5l7 7"/>',
  hosp: '<path d="M4 21V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16"/><path d="M2 21h20"/><path d="M12 7v6"/><path d="M9 10h6"/>',
  cal: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18"/><path d="M8 2v4"/><path d="M16 2v4"/>',
  ppl: '<circle cx="9" cy="7" r="3"/><path d="M3 20v-1a6 6 0 0 1 12 0v1"/><path d="M16 4.5a3 3 0 0 1 0 5"/>',
  siren: '<path d="M7 18v-6a5 5 0 0 1 10 0v6"/><path d="M5 21h14"/><path d="M12 3v2"/><path d="M4.2 6.2l1.4 1.4"/><path d="M19.8 6.2l-1.4 1.4"/>',
  phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  arrow: '<path d="M9 6l6 6-6 6"/>',
  pin: '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  memo: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>'
};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const toast = (t) => { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2400); };
const S = { center: 'dong', bk: { step: 1, dept: null, day: null, time: null, hosp: null }, drug: { q: store.get('drug', ''), state: 'idle', list: [], sel: null, meta: '' }, dept: '내과', day: 1, time: 1, booked: false, cat: '전체', big: store.get('big', false),
  pos: null, locState: 'idle', area: store.get('area', ''), results: [], searching: false, resultFor: '', er: [], erState: 'idle' };
document.documentElement.classList.toggle('big', S.big);

/* ---------- 위치와 카카오 장소 검색 ---------- */
let kakaoReady = null;
const loadKakao = () => kakaoReady || (kakaoReady = new Promise((res, rej) => {
  if (!window.kakao || !kakao.maps) { rej(new Error('sdk')); return; }
  kakao.maps.load(() => res());
}));
const getPos = () => new Promise((res, rej) => {
  if (!navigator.geolocation) { rej(new Error('nogeo')); return; }
  navigator.geolocation.getCurrentPosition((p) => res({ lat: p.coords.latitude, lng: p.coords.longitude }), rej, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
});
const askLocation = async () => {
  S.locState = 'asking'; render();
  try { S.pos = await getPos(); S.locState = 'ok'; }
  catch (e) { S.locState = 'denied'; }
  render();
  if (S.pos) { const p = location.hash.slice(1); if (p === 'emergency') searchER(); else searchPlaces(); }
};
const searchKakao = async (keyword, opts) => {
  await loadKakao();
  const ps = new kakao.maps.services.Places();
  return new Promise((res) => {
    const cb = (data, status) => res(status === kakao.maps.services.Status.OK ? data : []);
    const o = { size: 15 };
    if (opts.pos) { o.location = new kakao.maps.LatLng(opts.pos.lat, opts.pos.lng); o.radius = opts.radius || 3000; o.sort = kakao.maps.services.SortBy.DISTANCE; }
    if (opts.category) ps.categorySearch(opts.category, cb, o);
    else ps.keywordSearch(keyword, cb, o);
  });
};
const searchPlaces = async () => {
  const dept = S.dept;
  if (!S.pos && !S.area) return;
  S.searching = true; render();
  try {
    let list;
    if (S.pos) {
      list = dept === '약국' ? await searchKakao('', { pos: S.pos, category: 'PM9' }) : await searchKakao(dept, { pos: S.pos, radius: dept === '보건소' ? 15000 : 3000 });
    } else {
      list = await searchKakao(`${S.area} ${dept}`, {});
    }
    if (dept !== '약국' && dept !== '보건소') list = list.filter((p) => /병원|의원|의료|한의|치과|보건/.test(p.category_name || ''));
    S.results = list.slice(0, 10); S.resultFor = dept;
  } catch (e) { S.results = []; S.resultFor = dept; toast('지도를 불러오지 못했어요. 인터넷 연결을 확인하세요'); }
  S.searching = false; render();
};
/* 교육 장소(팔공노인복지관) 기준으로 찾기 */
const usePalgong = async () => {
  S.locState = 'asking'; render();
  try {
    const r = await searchKakao('팔공노인복지관', {});
    const hit = r.find((p) => /동북로 393/.test(p.road_address_name || '')) || r[0];
    if (!hit) throw new Error('none');
    S.pos = { lat: +hit.y, lng: +hit.x }; S.locState = 'palgong';
  } catch (e) { S.locState = 'idle'; toast('팔공노인복지관 위치를 찾지 못했어요'); }
  S.resultFor = ''; S.erState = 'idle';
  render();
  if (S.pos) { if (current() === 'emergency') searchER(); else searchPlaces(); }
};
const searchER = async () => {
  if (!S.pos) return;
  S.erState = 'loading'; render();
  try {
    const list = await searchKakao('응급실', { pos: S.pos, radius: 20000 });
    S.er = list.filter((p) => /병원|의료/.test(p.category_name || '')).slice(0, 5);
    S.erState = 'done';
  } catch (e) { S.er = []; S.erState = 'done'; }
  render();
};
const fmtDist = (m) => { m = +m; if (!m && m !== 0) return ''; const walk = Math.max(1, Math.round(m / 60)); const d = m < 1000 ? `${m}m` : `${(m / 1000).toFixed(1)}km`; return m <= 2000 ? `걸어서 약 ${walk}분 · ${d}` : `${d}`; };
const drawMap = async (list) => {
  const box = $('#map'); if (!box) return;
  try {
    await loadKakao();
    const center = S.pos ? new kakao.maps.LatLng(S.pos.lat, S.pos.lng) : (list[0] ? new kakao.maps.LatLng(+list[0].y, +list[0].x) : new kakao.maps.LatLng(35.8714, 128.6014));
    const map = new kakao.maps.Map(box, { center, level: 5 });
    const bounds = new kakao.maps.LatLngBounds();
    if (S.pos) {
      bounds.extend(center);
      new kakao.maps.CustomOverlay({ map, position: center, content: '<div style="background:#C62828;color:#fff;font:700 13px sans-serif;padding:4px 8px;border-radius:999px;border:2px solid #fff">나</div>', yAnchor: 0.5 });
    }
    list.forEach((p, i) => {
      const pos = new kakao.maps.LatLng(+p.y, +p.x); bounds.extend(pos);
      new kakao.maps.CustomOverlay({ map, position: pos, content: `<div style="background:#17714F;color:#fff;font:900 14px sans-serif;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff">${i + 1}</div>`, yAnchor: 0.5 });
    });
    if (list.length) map.setBounds(bounds);
  } catch (e) { box.innerHTML = '<p class="small" style="padding:1rem">지도를 표시할 수 없어요.</p>'; }
};
const placeCard = (p, i, color) => `<div class="card place">
<div style="display:flex;gap:.6rem;align-items:flex-start"><span class="badge" style="background:${color};color:#fff;font-size:.95rem">${i + 1}</span>
<div style="flex:1"><h2>${esc(p.place_name)}</h2><p class="sub" style="font-size:.9rem">${esc(fmtDist(p.distance))}</p><p class="small">${esc(p.road_address_name || p.address_name)}</p></div></div>
<div class="grid3">
${p.phone ? `<button class="btn" data-call="${esc(p.phone)}" data-label="${esc(p.place_name)}">전화</button>` : '<span class="btn" style="color:var(--sub)">번호 없음</span>'}
<a class="btn" href="https://map.kakao.com/link/to/${encodeURIComponent(p.place_name)},${p.y},${p.x}" target="_blank" rel="noopener">길찾기</a>
<a class="btn" href="${esc(p.place_url)}" target="_blank" rel="noopener">자세히</a>
</div></div>`;


/* ---------- 약 정보 (같은 사이트의 drugs.json) ---------- */
let drugDB = null;
const normName = (t) => String(t || '').replace(/\s+/g, '').toLowerCase();
const shortText = (t) => { if (!t) return ''; const parts = t.split(/(?<=[.다요])\s+/); const s2 = parts.slice(0, 2).join(' '); return s2.length > 160 ? s2.slice(0, 150) + '…' : s2; };
const searchDrug = async () => {
  const D = S.drug; const q = normName(D.q);
  if (!q) { toast('약 이름을 적어 주세요'); return; }
  store.set('drug', D.q);
  D.sel = null;
  if (!drugDB) {
    D.state = 'loading'; render();
    try {
      const r = await fetch('drugs.json', { cache: 'no-cache' });
      if (!r.ok) throw new Error('nodata');
      const j = await r.json();
      drugDB = j.items.map((p) => Object.assign(p, { k: normName(p.n) }));
      D.meta = j.updated || '';
    } catch (e) { D.state = 'nodata'; render(); return; }
  }
  const starts = [], has = [];
  for (const p of drugDB) { if (p.k.startsWith(q)) starts.push(p); else if (p.k.includes(q)) has.push(p); }
  D.list = starts.concat(has);
  D.state = 'done'; render();
};
const speakDrug = () => {
  const p = S.drug.sel; if (!p) return;
  if (!('speechSynthesis' in window)) { toast('이 휴대폰에서는 소리 읽기가 안 돼요'); return; }
  speechSynthesis.cancel();
  const m = summarizeDrug(p);
  const txt = [p.n, '어디에 먹는 약인가요. ' + m.use, '어떻게 먹나요. ' + m.how, '어르신이 꼭 확인할 것. ' + m.checks.map((c) => c.t + (c.tags ? ' ' + c.tags.join(', ') : '')).join(' ')].join('. ');
  const u = new SpeechSynthesisUtterance(txt); u.lang = 'ko-KR'; u.rate = 0.85;
  speechSynthesis.speak(u);
};


/* ---------- 병원 예약 (교육용 가상 병원) ---------- */
const BK_DEPTS = [['내과', '감기·혈압·당뇨'], ['정형외과', '무릎·허리·어깨'], ['안과', '눈 침침·백내장'], ['치과', '이·틀니'], ['이비인후과', '귀·코·목'], ['한의원', '침·한약'], ['피부과', '가려움·피부'], ['가정의학과', '어디로 갈지 모를 때']];
const BK_TIMES = ['오전 9시', '오전 10시', '오전 11시', '오후 2시', '오후 3시', '오후 4시'];
const bkDays = () => {
  const W = ['일', '월', '화', '수', '목', '금', '토'];
  const out = []; const d = new Date();
  while (out.length < 6) {
    if (d.getDay() !== 0) out.push({ week: W[d.getDay()] + '요일', md: `${d.getMonth() + 1}월 ${d.getDate()}일`, label: `${d.getMonth() + 1}월 ${d.getDate()}일 ${W[d.getDay()]}요일`, key: d.toDateString() });
    d.setDate(d.getDate() + 1);
  }
  return out;
};
const bkHash = (t) => { let h = 7; for (const c of t) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
const bkHospitals = () => {
  const B = S.bk;
  const suffix = B.dept === '한의원' ? '한의원' : B.dept + '의원';
  const names = ['늘봄', '햇살', '바른', '편안한'];
  const dists = ['걸어서 약 6분 · 350m', '걸어서 약 13분 · 800m', '버스 2정거장 · 1.2km', '버스 4정거장 · 2.1km'];
  const docs = ['김건강 원장', '이튼튼 원장', '박바른 원장', '최편안 원장'];
  const notes = ['엘리베이터 있음 · 주차 가능', '1층 · 계단 없음', '토요일 오전 진료', '대기 적음 · 주차 가능'];
  const key = B.dept + (bkDays()[B.day] || {}).key + B.time;
  const shut = bkHash(key) % 4;
  return names.map((n, i) => ({ name: `${n}${suffix}`, dist: dists[i], doctor: docs[i], note: notes[i], open: i !== shut || i === 0 }));
};


/* ---------- 대구 보건소 정보 (각 보건소 누리집 · 대구시 어르신 건강지원 안내, 2026년 11월 확인) ---------- */
const AI_CARE = (tel) => ({ cat: '스마트 건강관리', title: 'AI·스마트기기 건강관리', who: '65세 이상, 허약하거나 만성질환 관리가 필요한 어르신', what: '활동량계·혈압계 같은 기기를 받아 6개월 동안 휴대폰으로 건강 미션을 해요.', where: '집에서 (보건소 신청)', tel, label: 'AI 건강관리 담당' });
const CENTERS = [

/* ---------- 약 정보 요약: 식약처 원문에서 어르신께 중요한 내용만 골라 쉬운 문장으로 ---------- */
const splitS = (t) => (t || '').split(/(?<=[.])\s+/).map((x) => x.trim()).filter(Boolean);
const josa = (w, a, b) => { const c = w.charCodeAt(w.length - 1); return w + ((c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28) ? a : b); };
const COND = [
  [/고혈압/, '고혈압'], [/당뇨/, '당뇨병'], [/간장질환|간질환|간장애|간 질환|간기능/, '간 질환'],
  [/신장|콩팥/, '콩팥 질환'], [/심장|심질환/, '심장 질환'], [/녹내장/, '녹내장'],
  [/전립선|배뇨/, '전립선·소변 문제'], [/갑상선/, '갑상선 질환']
];
const SYM = ['발진', '두드러기', '가려움', '숨', '가슴답답', '어지러', '구역', '구토', '설사', '복통', '변비', '부종', '졸음', '두통'];
const SYM_LABEL = { '숨': '숨이 참', '가슴답답': '가슴 답답함', '어지러': '어지러움', '부종': '부기' };
const summarizeDrug = (p) => {
  const warnS = splitS([p.w, p.a].filter(Boolean).join(' '));
  const all = [p.w, p.a, p.i, p.s].join(' ');
  const checks = [];
  const old = warnS.find((s) => /고령자|노인/.test(s));
  if (old) checks.push({ t: /복용하지 마/.test(old) && !/상의/.test(old) ? '어르신(고령자)은 이 약을 먹지 말라고 되어 있어요.' : '어르신(고령자)은 먹기 전에 의사·약사와 먼저 상의하세요.' });
  const forbid = [], consult = [];
  for (const s of warnS) {
    for (const [re, name] of COND) if (re.test(s)) {
      if (/상의/.test(s)) { if (!consult.includes(name)) consult.push(name); }
      else if (/복용하지 마/.test(s)) { if (!forbid.includes(name)) forbid.push(name); }
    }
  }
  const forbidOnly = forbid.filter((n) => !consult.includes(n));
  if (forbidOnly.length) checks.push({ t: '이런 병이 있으면 이 약을 먹지 마세요.', tags: forbidOnly, strong: true });
  if (consult.length) checks.push({ t: '이런 병이 있으면 먹기 전에 의사·약사와 상의하세요.', tags: consult });
  if (/음주하지 마|술을 마시지 마/.test(all)) checks.push({ t: '약을 먹는 동안에는 술을 마시지 마세요.' });
  else if (/음주|알코올/.test(all)) checks.push({ t: '술을 자주 드시는 분은 의사·약사와 먼저 상의하세요.' });
  if (/운전/.test(all) && /졸음|졸릴/.test(all)) checks.push({ t: '졸릴 수 있어요. 먹은 뒤에는 운전이나 위험한 일을 하지 마세요.' });
  else if (/졸음|졸릴/.test(all)) checks.push({ t: '졸릴 수 있어요.' });
  if (/(해열진통제|감기약)[^.]*함께 복용하지 마/.test(p.i || '') || /다른 (해열진통제|감기약)[^.]*복용하지 마/.test(all)) checks.push({ t: '다른 감기약·진통제와 같이 먹지 마세요.' });
  if (p.i) checks.push({ t: '다른 약을 드시고 있으면 약사에게 약봉투를 꼭 보여 주세요.' });
  const stops = SYM.filter((w) => (p.s || '').includes(w)).slice(0, 5).map((w) => SYM_LABEL[w] || w);
  const dm = [p.a, p.s, p.w].join(' ').match(/(\d+\s*(?:일|주|개월))\s*(?:정도|이상|간|동안)?[^.]*?(?:복용|사용)[^.]*?(?:개선|좋아지|낫)/);
  const duration = dm ? `${dm[1].replace(/\s/g, '')} 정도 먹어도 좋아지지 않으면 멈추고 의사·약사와 상의하세요.` : '';
  return { use: splitS(p.e)[0] || '', how: p.u && p.u.length <= 170 ? p.u : splitS(p.u).slice(0, 2).join(' '), checks, stops, duration };
};

</div>`).join('')}
<p class="small">출처: ${C.src} (2026년 11월 확인). 일정과 신청 방법은 바뀔 수 있으니 전화로 꼭 확인하세요.</p>
<a class="go" style="background:var(--ink)" href="${C.web}" target="_blank" rel="noopener"><span><b>${C.name} 누리집 공지 보기</b><small>새로 열리는 교실 모집 소식</small></span>${svg(I.arrow, '#fff')}</a>
${memoBox('programs')}`;
},

notes: () => {
  const m = store.get('memo', {});
  const names = { medicine: '약 정보 찾기', hospital: '가까운 병원', emergency: '응급실 찾기', booking: '병원 예약', programs: '보건소 건강교실' };
  const rows = Object.keys(names).filter((k) => (m[k] || '').trim());
  return `${head('불편한 점 모음')}
<p class="sub">각 화면 아래에 적은 메모가 여기에 모여요. 복사해서 조원들과 나누세요.</p>
${rows.length ? rows.map((k) => `<div class="card"><h2>${names[k]}</h2><p style="white-space:pre-wrap">${esc(m[k])}</p></div>`).join('') : '<div class="card"><p class="sub">아직 적은 메모가 없어요. 화면마다 맨 아래 "불편한 점 적기"를 눌러 보세요.</p></div>'}
<button class="btn solid" id="copyNotes" style="background:var(--purple);min-height:3.6rem" ${rows.length ? '' : 'disabled'}>모두 복사하기</button>`;
}
};

const valid = Object.keys(pages);
const current = () => { const p = location.hash.slice(1); return valid.includes(p) ? p : 'home'; };
const render = () => {
  const page = current();
  $('#app').innerHTML = `<div class="wrap">${pages[page]()}</div>`;
  if ($('#map')) drawMap(page === 'emergency' ? S.er : S.results);
};
const go = (p) => { if (current() === p) render(); else location.hash = p === 'home' ? '' : p; window.scrollTo(0, 0); };
window.addEventListener('hashchange', () => {
  render(); window.scrollTo(0, 0);
  const p = current();
  if (p === 'hospital' && (S.pos || S.area) && S.resultFor !== S.dept) searchPlaces();
  if (p === 'emergency' && S.pos && S.erState === 'idle') searchER();
});

document.addEventListener('click', async (e) => {
  const t = e.target.closest('button, a');
  if (!t) return;
  if (t.dataset.call) {
    const n = t.dataset.call;
    $('#callTitle').textContent = n === '119' ? '정말 119에 전화할까요?' : `${t.dataset.label}에 전화할까요?`;
    $('#callSub').textContent = n === '119' ? '위급한 상황일 때만 눌러 주세요. 잘못 눌렀다면 "아니요"를 누르세요.' : `번호: ${n}`;
    $('#callYes').href = 'tel:' + n.replace(/[^0-9+]/g, '');
    $('#callYes').style.background = n === '119' ? 'var(--red)' : 'var(--blue)';
    $('#callDlg').hidden = false; $('#callNo').focus();
    return;
  }
  if (t.id === 'callNo') { $('#callDlg').hidden = true; return; }
  if (t.id === 'callYes') { setTimeout(() => { $('#callDlg').hidden = true; }, 300); return; }
  if (t.dataset.pick) S.dept = t.dataset.pick;
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.hasAttribute('data-loc')) { S.resultFor = ''; S.erState = 'idle'; askLocation(); return; }
  if (t.hasAttribute('data-palgong')) { usePalgong(); return; }
  if (t.id === 'areaGo') { const v = $('#area').value.trim(); if (!v) { toast('동네 이름을 적어 주세요'); return; } S.area = v; store.set('area', v); S.pos = null; S.locState = 'idle'; searchPlaces(); return; }
  if (t.dataset.dept) { S.dept = t.dataset.dept; render(); if (S.pos || S.area) searchPlaces(); return; }
  if (t.dataset.center) { S.center = t.dataset.center; S.cat = '전체'; render(); return; }
  if (t.dataset.cat) { S.cat = t.dataset.cat; render(); return; }
  if (t.hasAttribute('data-ask')) { toast('예시 화면이에요. 실제 앱에서는 보건소로 연결돼요'); return; }
  if (t.id === 'bigBtn') { S.big = !S.big; store.set('big', S.big); document.documentElement.classList.toggle('big', S.big); render(); return; }
  if (t.dataset.bkDept) { Object.assign(S.bk, { dept: t.dataset.bkDept, step: 2 }); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.bkDay) { Object.assign(S.bk, { day: +t.dataset.bkDay, step: 3 }); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.bkTime) { Object.assign(S.bk, { time: +t.dataset.bkTime, step: 4 }); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.bkHosp) { Object.assign(S.bk, { hosp: +t.dataset.bkHosp, step: 5 }); render(); window.scrollTo(0, 0); return; }
  if (t.hasAttribute('data-bk-other')) { S.bk.step = 3; render(); window.scrollTo(0, 0); return; }
  if (t.id === 'bkBack') { S.bk.step = Math.max(1, S.bk.step - 1); render(); window.scrollTo(0, 0); return; }
  if (t.id === 'bkReset') { S.bk = { step: 1, dept: null, day: null, time: null, hosp: null }; render(); window.scrollTo(0, 0); return; }
  if (t.id === 'drugGo') { S.drug.q = $('#drug').value.trim(); searchDrug(); return; }
  if (t.dataset.drug) { S.drug.sel = S.drug.list[+t.dataset.drug]; render(); window.scrollTo(0, 0); return; }
  if (t.id === 'drugBack') { if ('speechSynthesis' in window) speechSynthesis.cancel(); S.drug.sel = null; render(); return; }
  if (t.id === 'drugSpeak') { speakDrug(); return; }
  if (t.id === 'copyNotes') {
    const m = store.get('memo', {});
    const txt = Object.entries(m).filter(([, v]) => v.trim()).map(([k, v]) => `[${k}] ${v}`).join('\n\n');
    try { await navigator.clipboard.writeText(txt); toast('복사했어요'); } catch (err) { toast('복사가 막혀 있어요. 글을 길게 눌러 복사하세요'); }
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'area') $('#areaGo').click(); if (e.key === 'Enter' && e.target.id === 'drug') { e.preventDefault(); $('#drugGo').click(); } });
document.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.memo;
  if (k) { const m = store.get('memo', {}); m[k] = e.target.value; store.set('memo', m); }
});
render();
if (S.area && current() === 'hospital') searchPlaces();
}
</script>
</body>
</html>
